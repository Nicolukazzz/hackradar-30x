<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tu código para entrar</title>
  </head>
  <body style="margin:0;padding:32px 16px;background:#f7f8f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#101614;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e3e6e1;border-radius:16px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 4px;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:#5b6661;">Nébula Studio Inc.</p>
          <h1 style="margin:0 0 16px;font-size:20px;font-weight:600;">Tu código para entrar</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#5b6661;">
            Escríbelo en la pantalla de inicio de sesión del agente de cuentas por pagar. Vence en 10 minutos.
          </p>
          <p style="margin:0 0 24px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;font-weight:600;letter-spacing:0.3em;font-variant-numeric:tabular-nums;">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6661;">
            Si no pediste este código, ignora este correo: nadie puede entrar sin él.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
